version: '3.8'

services:
  chestvision-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chestvision_ai
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
