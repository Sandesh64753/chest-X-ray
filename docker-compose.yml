version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chestvision_app
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount models at runtime for local testing without rebuilding image
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
